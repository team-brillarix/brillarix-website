<svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Horizontal line -->
      <line x1="0" y1="0" x2="50" y2="0" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <!-- Vertical line -->
      <line x1="0" y1="0" x2="0" y2="50" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
</svg>
